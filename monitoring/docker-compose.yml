# Локальная Grafana с дашбордом кластера. Запуск: scripts/grafana.sh
# (скрипт пишет в .env IAM-токен и идентификатор воркспейса Prometheus).
services:
  grafana:
    image: grafana/grafana:11.6.1
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/slae-cluster.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      YC_IAM_TOKEN: ${YC_IAM_TOKEN:?run scripts/grafana.sh}
      PROMETHEUS_WORKSPACE_ID: ${PROMETHEUS_WORKSPACE_ID:?run scripts/grafana.sh}
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
      - ./dashboards:/var/lib/grafana/dashboards:ro
